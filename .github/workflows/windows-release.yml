# Builds everything a grader needs, on GitHub's Windows machine, and attaches it to the release.
#
# Why here and not on the development computer: Smart App Control there blocks Flutter's
# release compiler (problem log P-017). GitHub's Windows machines do not have it.
#
# Runs on every pushed tag v* (e.g. v1.0.0-beta.1), and by hand from the Actions tab
# (then the files are only kept as a download on the run, not released).
#
# Produces:
#   Bookstore-Apps-Setup-<version>.exe       installer for both apps (no administrator needed)
#   Bookstore-Apps-<version>-portable.zip    the same two apps, to unzip and run
#   Bookstore-Server-<version>.zip           the whole project with user-service.jar already built,
#                                            plus setup.cmd / start-services.cmd / stop-services.cmd

name: Windows release build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # to create the release and attach the files

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.50.0'   # the version the apps were written and tested with

      - name: Version
        run: |
          $v = if ('${{ github.ref_type }}' -eq 'tag') { '${{ github.ref_name }}'.TrimStart('v') } else { 'dev-${{ github.run_number }}' }
          # Flutter's own version number must be plain x.y.z: 1.0.0-beta.1 gives 1.0.0.
          $b = if ($v -match '^(\d+\.\d+\.\d+)') { $Matches[1] } else { '0.0.0' }
          "VERSION=$v" >> $env:GITHUB_ENV
          "BUILD_NAME=$b" >> $env:GITHUB_ENV
          "Version: $v (app version $b)"

      # --- Tests first: nothing is released that does not pass them.
      # (The tests that need MySQL or MongoDB skip themselves here; they ran on the development computer.)
      - name: user-service tests and jar
        run: mvn -B -q -f services/user-service/pom.xml package

      - name: Python service tests
        run: |
          python -m pip install --quiet -r services/book-service/requirements.txt -r services/order-service/requirements.txt
          Push-Location services/book-service;  python -m unittest discover -s tests -t .; if ($LASTEXITCODE) { exit 1 }; Pop-Location
          Push-Location services/order-service; python -m unittest discover -s tests -t .; if ($LASTEXITCODE) { exit 1 }; Pop-Location

      - name: Flutter tests
        run: |
          foreach ($p in 'bookstore-ui', 'customer-app', 'management-app') {
            Push-Location "clients/$p"; flutter test; if ($LASTEXITCODE) { exit 1 }; Pop-Location
          }

      # --- The apps, in release mode.
      - name: Build both apps (release)
        run: |
          foreach ($app in 'customer-app', 'management-app') {
            Push-Location "clients/$app"
            flutter build windows --release --build-name $env:BUILD_NAME
            if ($LASTEXITCODE) { exit 1 }
            # Flutter apps need the Visual C++ runtime. Shipped next to the exe (allowed by Microsoft's
            # redistribution terms), so the grader does not have to install it.
            foreach ($dll in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
              Copy-Item "C:\Windows\System32\$dll" 'build\windows\x64\runner\Release\'
            }
            Pop-Location
          }

      - name: Installer (Inno Setup)
        run: |
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          & $iscc "/DAppVersion=$env:VERSION" installer\bookstore.iss
          if ($LASTEXITCODE) { exit 1 }

      - name: Test the installer (install, open both apps, uninstall)
        run: |
          ./installer/test-installer.ps1 -Setup (Resolve-Path "dist/Bookstore-Apps-Setup-$env:VERSION.exe")
          if ($LASTEXITCODE) { exit 1 }

      - name: Portable apps zip and server zip
        run: |
          New-Item -ItemType Directory -Force dist, stage\apps | Out-Null
          Copy-Item -Recurse clients\customer-app\build\windows\x64\runner\Release stage\apps\Customer
          Copy-Item -Recurse clients\management-app\build\windows\x64\runner\Release stage\apps\Manager
          Copy-Item INSTALL.md stage\apps\
          Compress-Archive stage\apps\* "dist\Bookstore-Apps-$env:VERSION-portable.zip"

          # The server: exactly the committed files, plus the built jar.
          git archive --format=zip -o stage\source.zip HEAD
          Expand-Archive stage\source.zip stage\server
          New-Item -ItemType Directory -Force stage\server\services\user-service\target | Out-Null
          Copy-Item services\user-service\target\user-service.jar stage\server\services\user-service\target\
          Compress-Archive stage\server\* "dist\Bookstore-Server-$env:VERSION.zip"
          Get-ChildItem dist | ForEach-Object { "{0}  {1:N1} MB" -f $_.Name, ($_.Length / 1MB) }

      - uses: actions/upload-artifact@v4
        with:
          name: bookstore-${{ env.VERSION }}
          path: dist/*

      - name: Publish the GitHub release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Release notes: this version's section of CHANGELOG.md, without its heading.
          $text = Get-Content CHANGELOG.md -Raw -Encoding utf8
          $m = [regex]::Match($text, "(?ms)^## ${{ github.ref_name }} .*?\r?\n(.*?)(?=^## v)")
          $notes = if ($m.Success) { $m.Groups[1].Value.Trim() } else { 'See CHANGELOG.md.' }
          # Links in the changelog are relative to the repository; on the release page they must be full.
          $notes = $notes -replace '\]\((?!https?:)', "](https://github.com/${{ github.repository }}/blob/${{ github.ref_name }}/"
          Set-Content release-notes.md $notes -Encoding utf8
          $extra = @(); if ($env:VERSION -match '-') { $extra += '--prerelease' }   # e.g. -beta.1
          gh release view '${{ github.ref_name }}' 2>$null
          if ($LASTEXITCODE) {
            gh release create '${{ github.ref_name }}' --title "${{ github.ref_name }} $([char]0x2014) installable build" --notes-file release-notes.md @extra
            if ($LASTEXITCODE) { exit 1 }
          }
          gh release upload '${{ github.ref_name }}' (Get-ChildItem dist).FullName --clobber
