name: bookstore_ui
description: "Shared theme and widgets for the bookstore apps"
version: 0.1.0
publish_to: 'none'

environment:
  sdk: ^3.14.0
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  material_ui: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  fonts:
    # Inter: open-source interface typeface (SIL Open Font License), github.com/rsms/inter
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
          weight: 400
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    # Source Serif 4: open-source serif (SIL Open Font License), github.com/adobe-fonts/source-serif
    - family: SourceSerif4
      fonts:
        - asset: fonts/SourceSerif4-Regular.ttf
          weight: 400
        - asset: fonts/SourceSerif4-Semibold.ttf
          weight: 600
